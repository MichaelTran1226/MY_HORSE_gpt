services:
  - type: web
    name: equiflow
    runtime: docker
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
