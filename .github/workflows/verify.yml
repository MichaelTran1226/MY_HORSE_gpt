name: Verify EquiFlow
on:
  pull_request:
  push:
    branches: [master, main, develop, "codex/**"]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: equiflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: equiflow_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U equiflow" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://equiflow:ci-only-password@127.0.0.1:5432/equiflow_test
      TEST_DATABASE_URL: postgresql://equiflow:ci-only-password@127.0.0.1:5432/equiflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate && npx prisma migrate deploy && npm run build && npm test && npm run test:integration
        working-directory: backend
      - run: npm ci && npm run build && npm run lint
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npx playwright test
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: backend
